<script data-page-node-id="VYzaKrZrlJVFtIR0eajQ11" data-pnid-children="Vd2zljQsFA9c0RUGJaW2YC">
// ============ 已填入你的Worker域名 ============
const WORKER_API_BASE = "https://kq1.wanghai.qzz.io";
// ==============================================

// 内存缓存：全部数据来自云端KV
let cachedBarkUrl = "";
let memoryWorklog = {};
let memoryHolidays = {};   // 节假日集合：{ "2026-10-1": true }
let memoryNormals = {};    // 正常标记集合：{ "2026-10-1": true }（强制按周一~五算法）

// -------- Worker API 封装 --------
async function loadAllCloudData() {
  try {
    const res = await fetch(`${WORKER_API_BASE}/get?t=${Date.now()}`);
    const json = await res.json();
    if(json.ok){
      cachedBarkUrl = json.bark_url ?? "";
      const wl = json.worklog ?? {};
      // 节假日/正常标记挂在 worklog 的保留键 "_holidays"/"_normals" 下（Worker 原样存储整个对象）
      memoryHolidays = (wl._holidays && typeof wl._holidays === 'object') ? wl._holidays : {};
      delete wl._holidays;
      memoryNormals = (wl._normals && typeof wl._normals === 'object') ? wl._normals : {};
      delete wl._normals;
      memoryWorklog = wl;
      return true;
    }
  } catch (err) {
    console.error("读取云端失败", err);
  }
  return false;
}

async function saveBarkCloud(text) {
  try {
    const res = await fetch(`${WORKER_API_BASE}/save_bark`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: text })
    });
    const j = await res.json();
    return j.ok === true;
  } catch(e){ return false; }
}

async function saveWholeWorklogCloud() {
  try {
    // 每次保存都顺带携带节假日/正常标记（保留键 "_holidays"/"_normals"），避免互相覆盖丢失
    const payload = Object.assign({}, memoryWorklog);
    if(Object.keys(memoryHolidays).length){ payload._holidays = memoryHolidays; }
    if(Object.keys(memoryNormals).length){ payload._normals = memoryNormals; }
    const res = await fetch(`${WORKER_API_BASE}/save_worklog`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ worklog: payload })
    });
    const j = await res.json();
    return j.ok === true;
  } catch(e){ return false; }
}

// 节假日持久化：挂在 worklog 的保留键 "_holidays" 下，随 save_worklog 存云端
// （已验证 Worker 会原样存储整个 worklog 对象，"_holidays" 键不影响工时数据；
//   若服务器将来提供独立的 /save_holidays 接口，优先走该接口）
async function saveHolidaysCloud() {
  try {
    const res = await fetch(`${WORKER_API_BASE}/save_holidays`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ holidays: memoryHolidays })
    });
    const j = await res.json();
    if(j && j.ok === true) return true;
  } catch(e){}
  return await saveWholeWorklogCloud();
}

// -------- 日历核心，标准半角减号 --------
function key(y,m,d){ return y+"-"+m+"-"+d; }

function getLog(y,m,d){
  const k = key(y,m,d);
  const v = memoryWorklog[k];
  return (v===undefined || v===null) ? null : Number(v);
}

// -------- 正常标记：强制按「星期一到星期五」算法（超8计加班） --------
function isNormalMark(y,m,d){
  const k = holidayKey(y,m,d);
  return memoryNormals[k] === true || memoryNormals[k] === 1 || memoryNormals[k] === "1";
}
// 互斥：设为正常时清除同日节假日标记，反之亦然
function markNormal(y,m,d,on){
  const k = holidayKey(y,m,d);
  if(on){ memoryNormals[k] = true; delete memoryHolidays[k]; }
  else { delete memoryNormals[k]; }
}

async function setLog(y,m,d,v){
  const k = key(y,m,d);
  if(v===null || v===""){
    delete memoryWorklog[k];
  }else{
    memoryWorklog[k] = Number(v);
  }
  await saveWholeWorklogCloud();
}

// -------- 节假日：日历「假」标记 --------
function holidayKey(y,m,d){ return y+"-"+m+"-"+d; }
function isHoliday(y,m,d){
  const k = holidayKey(y,m,d);
  return memoryHolidays[k] === true || memoryHolidays[k] === 1 || memoryHolidays[k] === "1";
}
async function setHoliday(y,m,d,on){
  const k = holidayKey(y,m,d);
  if(on){ memoryHolidays[k] = true; } else { delete memoryHolidays[k]; }
  await saveHolidaysCloud();
}

const _now = new Date();
const TODAY = { y:_now.getFullYear(), m:_now.getMonth()+1, d:_now.getDate() };
const WEEK = ["日","一","二","三","四","五","六"];
const MONTHS = ["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];
function monthStats(y,m){
  const days = new Date(y,m,0).getDate();
  let cnt=0, rest=0, total=0;
  for(let d=1;d<=days;d++){ const v=getLog(y,m,d); if(v!==null){ if(v>0){ cnt++; total+=v; } else { rest++; } } }
  return {days,cnt,rest,total};
}
// 工时对应颜色：0=红 8=绿 10=蓝 11=紫，其余灰色
function hoursColor(v){
  if(v===0) return '#f5222d';
  if(v===8) return '#52c41a';
  if(v===10) return '#13c2c2';
  if(v===11) return '#722ed1';
  return '#8c8c8c';
}
function renderPanel(el, y, m){  const firstDow = new Date(y, m-1, 1).getDay();
  const firstDay = firstDow;
  const days = new Date(y, m, 0).getDate();
  let html = '<table id="calTable"><thead><tr>' + WEEK.map(w=>`<th>${w}</th>`).join('') + '</tr></thead><tbody>';
  let cells = [];
  for(let i=0;i<firstDay;i++) cells.push('<td class="empty"></td>');
  for(let d=1; d<=days; d++){
    let cls = '';
    const isHoli = isHoliday(y,m,d);
    const isNorm = !isHoli && isNormalMark(y,m,d);
    if(new Date(y,m-1,d).getDay()%6===0) cls = 'weekend';
    if(isHoli) cls += ' holiday';
    if(isNorm) cls += ' normal-mark';
    if(y===TODAY.y && m===TODAY.m && d===TODAY.d) cls += ' today';
    if(selectedTs.has(dayStart(new Date(y,m-1,d)))) cls += ' sel';
    const logged = getLog(y,m,d);
    if(logged!==null) cls += ' logged ' + (logged>0 ? 'logged-work' : 'logged-rest');
    // 有实际加班（工作日/正常标记日 工时>8）的日期：填充浅绿色
    if(!isHoli && logged!==null && logged>8 && ((new Date(y,m-1,d).getDay()+6)%7 < 5 || isNorm)) cls += ' has-ot';
    // 标「正」的日子：填充绿色（无论工时多少）
    if(isNorm) cls += ' has-norm-green';
    // 休息（0小时）：填充浅红色
    if(logged!==null && logged===0) cls += ' has-rest';
    // 星期六日（排除节假日、正常标记）：填充浅紫色（需已标注工时或已标「休」）
    if(new Date(y,m-1,d).getDay()%6===0 && !isHoli && !isNorm && logged!==null) cls += ' has-weekend';
    let inner = isHoli ? '<span class="cal-holi-tag">假</span>' : (isNorm ? '<span class="cal-norm-tag">正</span>' : '');
    inner += String(d);
    if(logged!==null){
      // 右上角「xx小时」字样按工时着色：0=红 8=绿 10=蓝 11=紫，其余灰
      inner += `<span class="wh ${logged>0?'wh-work':'wh-rest'}" style="color:${hoursColor(logged)}">${logged===0?'休':logged+'h'}</span>`;
      // 色柱颜色与右上角小时文字一致：0=红 8=绿 10=蓝 11=紫，其余灰
      const bw = 70;
      const bc = hoursColor(logged);
      inner += `<span class="day-bar" style="width:${bw}%;background:${bc}"></span>`;
    }
    cells.push(`<td class="${cls.trim()}" data-y="${y}" data-m="${m}" data-d="${d}">${inner}</td>`);
  }
  while(cells.length % 7 !== 0) cells.push('<td class="empty"></td>');
  for(let i=0;i<cells.length;i+=7){ html += '<tr>' + cells.slice(i,i+7).join('') + '</tr>'; }
  html += '</tbody></table>';
  el.innerHTML = html;
}

let cur = { y: TODAY.y, m: TODAY.m };
// 可连选规则：已取消月份限制 —— 当前显示的任意月份、任意日期都可点击连选。
// dayStart：把日期「零点化」，避免时分秒与跨月/跨年误差
function dayStart(dt){ return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()).getTime(); }
const track = document.getElementById('track');
const p0 = document.getElementById('p0');
const p1 = document.getElementById('p1');
const p2 = document.getElementById('p2');
const titleEl = document.getElementById('title');

function fillPanels(){
  let py = cur.y, pm = cur.m - 1; if(pm<1){ pm=12; py--; }
  let ny = cur.y, nm = cur.m + 1; if(nm>12){ nm=1; ny++; }
  renderPanel(p0, py, pm);
  renderPanel(p1, cur.y, cur.m);
  renderPanel(p2, ny, nm);
  titleEl.textContent = cur.y + ' 年 ' + cur.m + ' 月';
  updateStats();
}
function gotoBase(animate){
  track.classList.toggle('no-anim', !animate);
  track.style.transform = 'translateX(-100%)';
  if(!animate){ void track.offsetWidth; track.classList.remove('no-anim'); }
}
function goNext(){
  track.style.transform = 'translateX(-200%)';
  setTimeout(()=>{
    cur.m++; if(cur.m>12){ cur.m=1; cur.y++; }
    fillPanels();
    gotoBase(false);
  }, 320);
}
function goPrev(){
  track.style.transform = 'translateX(0)';
  setTimeout(()=>{
    cur.m--; if(cur.m<1){ cur.m=12; cur.y--; }
    fillPanels();
    gotoBase(false);
  }, 320);
}

const vp = document.getElementById('viewport');
let startX=0, startY=0, dragging=false, decided=false, horiz=false;
const THRESH = 40;
let justDragged = false;
function onStart(x,y){ startX=x; startY=y; dragging=true; decided=false; horiz=false; }
function onMove(x,y){
  if(!dragging) return;
  const dx=x-startX, dy=y-startY;
  if(!decided && (Math.abs(dx)>8 || Math.abs(dy)>8)){
    decided=true; horiz = Math.abs(dx) > Math.abs(dy);
  }
  if(horiz){
    const clamped = Math.max(-vp.clientWidth, Math.min(vp.clientWidth, dx*0.5));
    track.style.transform = `translateX(calc(-100% + ${clamped}px))`;
  }
}
function onEnd(x){
  if(!dragging) return;
  dragging=false;
  if(!horiz) return;
  const dx = x - startX;
  track.classList.remove('no-anim');
  if(dx < -THRESH){ justDragged = true; setTimeout(()=>justDragged=false, 400); goNext(); }
  else if(dx > THRESH){ justDragged = true; setTimeout(()=>justDragged=false, 400); goPrev(); }
  else gotoBase(true);
}
vp.addEventListener('touchstart', e=> onStart(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
vp.addEventListener('touchmove', e=> onMove(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
vp.addEventListener('touchend', e=> onEnd(e.changedTouches[0].clientX));
vp.addEventListener('mousedown', e=> onStart(e.clientX, e.clientY));
window.addEventListener('mousemove', e=> onMove(e.clientX, e.clientY));
window.addEventListener('mouseup', e=> onEnd(e.clientX));

// ============ 批量连选 & 一次性设置工时 ============
// 交互：点击日期 = 选中/取消（可连选多个，任意月份均可），选好后点击「保存」一次性写入所有选中日期。
const selectedTs = new Set();   // 已选日期集合（存 dayStart 时间戳，跨月/跨年安全）
const batchBar   = document.getElementById('batchBar');
const batchCount = document.getElementById('batchCount');
const batchRange = document.getElementById('batchRange');
const batchInput = document.getElementById('batchInput');
const batchMsg   = document.getElementById('batchMsg');
const batchQuick = document.getElementById('batchQuick');
const batchClose = document.getElementById('batchClose');
function showBatchPopup(){ batchBar.classList.add('show'); }
function hideBatchPopup(){ batchBar.classList.remove('show'); }
const batchDel   = document.getElementById('batchDel');
const batchHoliday = document.getElementById('batchHoliday');
let batchHideTimer = null;
// 弹窗内「待保存」的标记意图：true=设为, false=取消, null=不改变
let pendHoliday = null, pendNormal = null;
function resetPendingMarks(){
  pendHoliday = null; pendNormal = null;
  if(batchHoliday){ batchHoliday.classList.remove('on'); batchHoliday.textContent = '节假日'; }
  if(batchNormal){ batchNormal.classList.remove('on'); batchNormal.textContent = '正常工作日'; }
}

function selectedDates(){
  return [...selectedTs].sort((a,b)=>a-b).map(ts=>{
    const dt = new Date(ts);
    return { y: dt.getFullYear(), m: dt.getMonth()+1, d: dt.getDate() };
  });
}

function showBatchMsg(text, ok){
  batchMsg.textContent = text;
  batchMsg.className = 'batch-msg ' + (ok ? 'ok' : 'err');
}
function scheduleBatchHide(){
  clearTimeout(batchHideTimer);
  batchHideTimer = setTimeout(()=>{
    batchHideTimer = null;
    batchMsg.textContent = '';
    if(!selectedTs.size) hideBatchPopup();
  }, 2000);
}

// 关闭弹窗：清空选择并隐藏
function closeBatchPopup(){
  clearTimeout(batchHideTimer); batchHideTimer = null;
  selectedTs.clear();
  resetPendingMarks();
  fillPanels();
  hideBatchPopup();
  batchMsg.textContent = '';
  batchCount.textContent = '0';
  batchRange.textContent = '';
}
if(batchClose){
  batchClose.addEventListener('click', closeBatchPopup);
}

// 保存/清除成功后选择已清空：计数与范围归零，但保留成功提示 2 秒
function resetBatchCounts(){
  batchCount.textContent = '0';
  batchRange.textContent = '';
}

function updateBatchBar(){
  const n = selectedTs.size;
  if(n > 0){
    batchCount.textContent = n;
    const ds = selectedDates();
    batchRange.textContent = ds.length > 1
      ? `（${ds[0].m}/${ds[0].d} ~ ${ds[ds.length-1].m}/${ds[ds.length-1].d}）` : '';
    showBatchPopup();
    syncBatchHoliday();
    syncBatchNormal();
  }else if(!batchHideTimer){
    hideBatchPopup();
    batchMsg.textContent = '';
  }
}

// 假日按钮状态：根据选中日期现状初始化「待保存」意图
function syncBatchHoliday(){
  if(!batchHoliday) return;
  const ds = selectedDates();
  const allHoli = ds.length > 0 && ds.every(o=>isHoliday(o.y,o.m,o.d));
  // 已存待保存意图时不覆盖
  if(pendHoliday === null){
    batchHoliday.classList.toggle('on', allHoli);
    batchHoliday.textContent = allHoli ? '🚫 取消节假日' : '节假日';
  }
}

// 正常按钮状态：根据选中日期现状初始化「待保存」意图
function syncBatchNormal(){
  if(!batchNormal) return;
  const ds = selectedDates();
  const allNorm = ds.length > 0 && ds.every(o=>isNormalMark(o.y,o.m,o.d));
  if(pendNormal === null){
    batchNormal.classList.toggle('on', allNorm);
    batchNormal.textContent = allNorm ? '🚫 取消正常工作日' : '正常工作日';
  }
}

function clearSelection(){
  selectedTs.clear();
  fillPanels();
  updateBatchBar();
}

function syncBatchQuick(){
  const v = batchInput.value;
  batchQuick.querySelectorAll('button').forEach(b=>{
    b.classList.toggle('active', b.dataset.h === String(v));
  });
}
batchInput.addEventListener('input', ()=>{

// 保存：把输入的工时 + 假日/正常标记 一次性写入所有选中日期（单次云端请求）
async function saveBatchHours(extraTip){
  if(!selectedTs.size) return;
  const raw = batchInput.value.trim();
  const v = parseFloat(raw);
  const hasHours = !(raw==='' || isNaN(v) || v<0);
  const hasMark  = (pendHoliday !== null) || (pendNormal !== null);
  if(!hasHours && !hasMark){
    showBatchMsg('⚠️ 请先选择小时或节假日/正常工作日', false); return;
  }
  const val = hasHours ? Math.min(v, 24) : null;
  const ds = selectedDates();
  for(const o of ds){
    const k = key(o.y,o.m,o.d), hk = holidayKey(o.y,o.m,o.d);
    if(val !== null) memoryWorklog[k] = val;
    // 应用假日意图
    if(pendHoliday === true){ memoryHolidays[hk] = true; delete memoryNormals[hk]; }
    else if(pendHoliday === false){ delete memoryHolidays[hk]; }
    // 应用正常意图
    if(pendNormal === true){ memoryNormals[hk] = true; delete memoryHolidays[hk]; }
    else if(pendNormal === false){ delete memoryNormals[hk]; }
  }
  showBatchMsg('保存中…', true);
  const ok = await saveWholeWorklogCloud();
  if(ok){
    const n = ds.length;
    const bits = [];
    if(val !== null) bits.push(`${val} 小时`);
    if(pendHoliday === true) bits.push('节假日');
    if(pendHoliday === false) bits.push('取消节假日');
    if(pendNormal === true) bits.push('正常工作日');
    if(pendNormal === false) bits.push('取消正常工作日');
    selectedTs.clear();
    resetPendingMarks();
    fillPanels();
    resetBatchCounts();
    showBatchMsg(`✅ ${extraTip || '保存成功'}：${n} 天已设置 ${bits.join('、')}`, true);
    scheduleBatchHide();
  }else{
    showBatchMsg('❌ 云端保存失败，请重试', false);
  }
}

function updateStats(){
  const y=cur.y, m=cur.m;
  const monthCn = MONTHS[m-1];
  const daysInMonth = new Date(y, m, 0).getDate();   // 当月总天数
  window._currentBarkTitle = `【${monthCn}考勤-共${daysInMonth}天】`;
  // 按工时值统计天数：休息(0) / 8小时 / 10小时 / 11小时 / 其他
  const hourDays = {};   // 值 -> 天数
  let loggedTotal = 0;
  for(let d=1; d<=daysInMonth; d++){
    const v = getLog(y,m,d);
    if(v===null) continue;
    loggedTotal++;
    const k = (v===0) ? '休息' : (Number.isInteger(v) ? String(v)+'小时' : v+'小时');
    hourDays[k] = (hourDays[k]||0) + 1;
  }
  // 固定顺序：休息 -> 8 -> 10 -> 11 -> 其他按数值升序
  const order = ['休息','8小时','10小时','11小时'];
  const parts = [];
  for(const k of order){ if(hourDays[k]) parts.push(`${k}：${hourDays[k]} 天`); }
  for(const k of Object.keys(hourDays).sort((a,b)=>{
    const na=parseFloat(a), nb=parseFloat(b);
    return (isNaN(na)||isNaN(nb)) ? a.localeCompare(b) : na-nb;
  })){ if(!order.includes(k)) parts.push(`${k}：${hourDays[k]} 天`); }
  const statLine = parts.length ? parts.join('，') : '暂无记录';
  window._currentBarkBody = statLine;

  // ---- 加班/双休日/节假日 三类汇总 + 计算公式 ----
  const WORK_HOURS = 8;
  let weekdayDays = 0, overtimeHours = 0, overtimeDays = 0;
  let weekendHours = 0, weekendDays = 0, holiHours = 0, holiDays = 0;
  for(let d=1; d<=daysInMonth; d++){
    const dow = (new Date(y,m-1,d).getDay()+6)%7;   // 0=周一
    const isWeekend = dow>=5;
    const isHoli = isHoliday(y,m,d);
    const isNorm = !isHoli && isNormalMark(y,m,d);
    if(dow<5) weekdayDays++;
    const v = getLog(y,m,d);
    if(v===null) continue;
    if(isHoli){
      if(v>0){ holiHours += v; holiDays++; }
    }else if(isNorm){
      if(v>WORK_HOURS){ overtimeHours += v-WORK_HOURS; overtimeDays++; }
    }else if(isWeekend){
      if(v>0){ weekendHours += v; weekendDays++; }
    }else{
      if(v>WORK_HOURS){ overtimeHours += v-WORK_HOURS; overtimeDays++; }
    }
  }
  // ---- Bark 推送正文：正常工作日 / 双休日 / 节假日 / 休息 ----
  const restDays = hourDays['休息'] || 0;
  window._currentBarkBody = `正常工作日 ${overtimeDays} 天，实际加班 ${overtimeHours} 小时\n`
    + `* 双休日 ${weekendHours} 小时\n`
    + `* 节假日 ${holiHours} 小时\n`
    + `* 休息 ${restDays} 天`;
  // 一行式图例：小方块 + 名称 + 天数/小时数（数值随后面考勤表格同步）
  const statExtra = `<div class="stat-legend-one">`
    + `<span class="legend-cell"><span class="stat-sq"></span>正常工作日 ${overtimeDays} 天，实际加班 ${overtimeHours} 小时</span>`
    + `<span class="legend-cell"><span class="stat-sq-org"></span>节假日 ${holiDays} 天，${holiHours} 小时</span>`
    + `<span class="legend-cell"><span class="stat-sq-pur"></span>双休日 ${weekendDays} 天，${weekendHours} 小时</span>`
    + `<span class="legend-cell"><span class="stat-sq-red"></span>休息 ${hourDays['休息']||0} 天</span>`
    + `</div>`;

  const el = document.getElementById('stats');
  if(el){
    el.innerHTML = statExtra;
  }
}

sendBarkBtn.addEventListener('click', async ()=>{
  sendBarkBtn.classList.remove('sent');
  let urlRaw = (cachedBarkUrl||'').trim();
  if(!urlRaw){
    barkTip.textContent="⚠️请先编辑Bark地址";
    barkTip.style.color="#f5222d";
    return;
  }
  if(!window._currentBarkBody || !window._currentBarkTitle){
    barkTip.textContent="⚠️暂无统计内容";
    barkTip.style.color="#f5222d";
    return;
  }
  // 协议统一：https页面请求http接口会被浏览器当作混合内容直接拦截(手机端尤其严格)，
  // 故发送前自动把 http:// 升级为 https://（Bark官方服务器支持https）
  const wasHttp = /^http:\/\//i.test(urlRaw);
  if(wasHttp){ urlRaw = 'https://' + urlRaw.slice(7); }
  else if(!/^https:\/\//i.test(urlRaw)){ urlRaw = 'https://' + urlRaw; }
  urlRaw = urlRaw.replace(/\/+$/,'');
  barkTip.textContent="发送中…";
  barkTip.style.color="#666";
  const t = encodeURIComponent(window._currentBarkTitle);
  const b = encodeURIComponent(window._currentBarkBody);
  const attempt = async (fn)=>{ try{ await fn(); return true; }catch(e){ console.error(e); return false; } };
  // 方式1：POST表单（no-cors，请求发出即成功）
  let ok = await attempt(()=> fetch(urlRaw, {
    method:'POST', mode:'no-cors',
    headers:{ 'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8' },
    body: new URLSearchParams({ title: window._currentBarkTitle, body: window._currentBarkBody })
  }));
  // 方式2：GET路径兜底（Bark原生GET格式 /key/title/body）
  if(!ok){
    ok = await attempt(()=> fetch(`${urlRaw}/${t}/${b}`, { method:'GET', mode:'no-cors' }));
  }
  if(ok){
    barkTip.textContent="✅Bark推送发送成功";
    barkTip.style.color="#00b42a";
    sendBarkBtn.classList.add('sent');
  }else if(wasHttp && location.protocol==='https:'){
    barkTip.textContent="❌发送失败：Bark地址为http，当前https页面禁止调用，请改用https地址";
    barkTip.style.color="#f5222d";
  }else{
    barkTip.textContent="❌发送失败，请检查网络或Bark地址是否正确";
    barkTip.style.color="#f5222d";
  }
  setTimeout(showBarkConn,3000);
});

// ================= 登录认证（门禁） =================
// ---- 预留 API：接入真实后端时，把 enabled 改为 true 并填好对应路径 ----
const AUTH_API = {
  base: WORKER_API_BASE,           // 后端域名（复用现有 Worker 域名）
  login:    "/auth/login",         // 预留：POST { username, password }
  register: "/auth/register",      // 预留：POST { username, password }
  changePwd:"/auth/change_pwd",    // 预留：POST { username, oldPassword, newPassword }
  enabled: false                   // ← true = 走真实接口，false = 本地模拟
};
const AUTH_LS = { user:"kq_auth_user", pwd:"kq_auth_pwd", rem:"kq_auth_rem", reg:"kq_auth_regs", session:"kq_auth_session" };
const AUTH_DEFAULT_USERS = { "9523130": "123456" };  // 内置账号

// 轻量混淆（非加密，仅避免明文直读；真实项目请走后端哈希）
function authEnc(s){ try{ return btoa(unescape(encodeURIComponent(s))); }catch(e){ return s; } }
function authDec(s){ try{ return decodeURIComponent(escape(atob(s))); }catch(e){ return s; } }

function authGetRegistered(){
  try{ return JSON.parse(localStorage.getItem(AUTH_LS.reg) || "{}"); }catch(e){ return {}; }
}
function authAllUsers(){
  // 内置账号 + 本地注册/改密覆盖（后者优先）
  return Object.assign({}, AUTH_DEFAULT_USERS, authGetRegistered());
}
function authSaveRegistered(obj){
  try{ localStorage.setItem(AUTH_LS.reg, JSON.stringify(obj)); }catch(e){}
}

// 真实 API 调用封装（enabled=true 时启用）
async function authApiCall(path, payload){
  const res = await fetch(AUTH_API.base + path, {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(payload)
  });
  return await res.json();
}

(function bindAuth(){
  const gate = document.getElementById('authMask');
  const viewLogin = document.getElementById('authViewLogin');
  const viewReg   = document.getElementById('authViewReg');
  const viewPwd   = document.getElementById('authViewPwd');
  const msgLogin  = document.getElementById('authMsg');
  const msgReg    = document.getElementById('regMsg');
  const msgPwd    = document.getElementById('pwdMsg');

  function showView(v){
    viewLogin.style.display = (v==='login') ? '' : 'none';
    viewReg.style.display   = (v==='reg')   ? '' : 'none';
    viewPwd.style.display   = (v==='pwd')   ? '' : 'none';
  }
  function setMsg(el, text, ok){
    el.textContent = text || '';
    el.className = 'auth-msg' + (ok ? ' ok' : '');
  }

  // ---------- 记住密码：自动填充 ----------
  (function autoFill(){
    try{
      const u = localStorage.getItem(AUTH_LS.user) || '';
      const rem = localStorage.getItem(AUTH_LS.rem) === '1';
      document.getElementById('authUser').value = u;
      document.getElementById('pwdUser').value = u;
      if(rem){
        document.getElementById('authRemember').checked = true;
        const p = localStorage.getItem(AUTH_LS.pwd);
        if(p) document.getElementById('authPass').value = authDec(p);
      }
    }catch(e){}
  })();

  // ---------- 登录 ----------
  async function doLogin(){
    const u = (document.getElementById('authUser').value||'').trim();
    const p = document.getElementById('authPass').value || '';
    if(!u || !p){ setMsg(msgLogin, '请输入登录名和密码'); return; }
    let ok = false, reason = '登录名或密码错误';
    if(AUTH_API.enabled){
      try{ const r = await authApiCall(AUTH_API.login, { username:u, password:p }); ok = !!r.ok; reason = r.msg || reason; }
      catch(e){ reason = '网络异常，请稍后重试'; }
    }else{
      const users = authAllUsers();
      ok = (users[u] !== undefined && users[u] === p);
    }
    if(!ok){ setMsg(msgLogin, reason); return; }
    // 记住策略
    try{
      localStorage.setItem(AUTH_LS.user, u);
      if(document.getElementById('authRemember').checked){
        localStorage.setItem(AUTH_LS.rem, '1');
        localStorage.setItem(AUTH_LS.pwd, authEnc(p));
      }else{
        localStorage.setItem(AUTH_LS.rem, '0');
        localStorage.removeItem(AUTH_LS.pwd);
      }
      sessionStorage.setItem(AUTH_LS.session, '1');
    }catch(e){}
    setMsg(msgLogin, '登录成功，正在进入…', true);
    gate.classList.add('hide');
    enterApp();
  }

  // ---------- 注册 ----------
  async function doRegister(){
    const u = (document.getElementById('regUser').value||'').trim();
    const p = document.getElementById('regPass').value || '';
    const p2 = document.getElementById('regPass2').value || '';
    if(!/^[A-Za-z0-9_]{3,16}$/.test(u)){ setMsg(msgReg, '登录名需 3-16 位字母/数字/下划线'); return; }
    if(p.length < 6){ setMsg(msgReg, '密码至少 6 位'); return; }
    if(p !== p2){ setMsg(msgReg, '两次输入的密码不一致'); return; }
    if(authAllUsers()[u] !== undefined && !authGetRegistered().hasOwnProperty(u)){
      setMsg(msgReg, '该登录名已被占用'); return;
    }
    if(authGetRegistered().hasOwnProperty(u)){ setMsg(msgReg, '该登录名已注册'); return; }
    if(AUTH_API.enabled){
      try{
        const r = await authApiCall(AUTH_API.register, { username:u, password:p });
        if(!r.ok){ setMsg(msgReg, r.msg || '注册失败'); return; }
      }catch(e){ setMsg(msgReg, '网络异常，请稍后重试'); return; }
    }else{
      const regs = authGetRegistered(); regs[u] = p; authSaveRegistered(regs);
    }
    setMsg(msgReg, '注册成功，请返回登录', true);
    setTimeout(()=>{
      showView('login');
      document.getElementById('authUser').value = u;
      document.getElementById('authPass').value = p;
      setMsg(msgLogin, '注册成功，请登录', true);
    }, 700);
  }

  // ---------- 修改密码 ----------
  async function doChangePwd(){
    const u = (document.getElementById('pwdUser').value||'').trim();
    const o = document.getElementById('pwdOld').value || '';
    const n = document.getElementById('pwdNew').value || '';
    const n2 = document.getElementById('pwdNew2').value || '';
    if(!u || !o){ setMsg(msgPwd, '请输入登录名和原密码'); return; }
    if(n.length < 6){ setMsg(msgPwd, '新密码至少 6 位'); return; }
    if(n !== n2){ setMsg(msgPwd, '两次输入的新密码不一致'); return; }
    if(AUTH_API.enabled){
      try{
        const r = await authApiCall(AUTH_API.changePwd, { username:u, oldPassword:o, newPassword:n });
        if(!r.ok){ setMsg(msgPwd, r.msg || '修改失败'); return; }
      }catch(e){ setMsg(msgPwd, '网络异常，请稍后重试'); return; }
    }else{
      const users = authAllUsers();
      if(users[u] === undefined || users[u] !== o){ setMsg(msgPwd, '登录名或原密码错误'); return; }
      const regs = authGetRegistered(); regs[u] = n; authSaveRegistered(regs);
    }
    setMsg(msgPwd, '密码修改成功，请返回登录', true);
    setTimeout(()=>{
      showView('login');
      document.getElementById('authUser').value = u;
      document.getElementById('authPass').value = '';
      localStorage.setItem(AUTH_LS.user, u);
      localStorage.setItem(AUTH_LS.rem,'0');
      localStorage.removeItem(AUTH_LS.pwd);
      setMsg(msgLogin, '密码已修改，请重新登录', true);
    }, 700);
  }

  // ---------- 事件绑定 ----------
  document.getElementById('authLoginBtn').addEventListener('click', doLogin);
  document.getElementById('regSubmit').addEventListener('click', doRegister);
  document.getElementById('pwdSubmit').addEventListener('click', doChangePwd);
  document.getElementById('authToReg').addEventListener('click', ()=>{ setMsg(msgReg,''); showView('reg'); });
  document.getElementById('authToPwd').addEventListener('click', ()=>{ setMsg(msgPwd,''); showView('pwd'); });
  document.getElementById('regBack').addEventListener('click', ()=>showView('login'));
  document.getElementById('pwdBack').addEventListener('click', ()=>showView('login'));
  // 回车快捷提交
  ['authPass'].forEach(id=>document.getElementById(id).addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); }));
  document.getElementById('regPass2').addEventListener('keydown', e=>{ if(e.key==='Enter') doRegister(); });
  document.getElementById('pwdNew2').addEventListener('keydown', e=>{ if(e.key==='Enter') doChangePwd(); });

  // 退出登录
  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    try{ sessionStorage.removeItem(AUTH_LS.session); }catch(e){}
    document.body.classList.remove('app-on');   // 回到登录页：重新显示主题切换按钮
    document.getElementById('authPass').value = '';
    setMsg(msgLogin, '');
    showView('login');
    gate.classList.remove('hide');
    window.scrollTo(0,0);
  });

  // ---------- 门禁放行 ----------
  window.__authEnter = enterApp;
  // 同一浏览器标签页上一次已登录（session 内），直接放行
  let autoIn = false;
  try{ autoIn = sessionStorage.getItem(AUTH_LS.session) === '1'; }catch(e){}
  if(autoIn){ gate.classList.add('hide'); enterApp(); }
})();

// ================= 查看当月考勤（A4 横向打印） =================
(function bindViewAttendance(){
  const printMask = document.getElementById('printMask');
  function closeAttView(){
    printMask.classList.remove('show');
    document.body.classList.remove('att-view');
    window.scrollTo(0,0);
  }
  document.getElementById('printClose').addEventListener('click', closeAttView);
  document.getElementById('printBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('printBtn');
    const prevText = btn.textContent;
    btn.disabled = true;
    btn.textContent = '导出中…';
    try{
      // 导出「当前查看的月份」（第二页可翻月），而非日历当前月
      const y = viewCur ? viewCur.y : cur.y;
      const m = viewCur ? viewCur.m : cur.m;
      await exportMonthXlsx(y, m);
      barkTip.textContent = `✅已导出 ${y}年${m}月考勤.xlsx`;
      barkTip.style.color = '#00b42a';
    }catch(e){
      console.error(e);
      barkTip.textContent = '❌导出失败，请检查网络后重试';
      barkTip.style.color = '#f5222d';
    }
    btn.disabled = false;
    btn.textContent = prevText === '导出中…' ? '导出Excel' : prevText;
  });

  let viewCur = null;
  function buildAttendanceSheet(){
    const y=viewCur.y, m=viewCur.m;
    const totalDays = new Date(y,m,0).getDate();
    const WEEK=["一","二","三","四","五","六","日"];
    const WORK_HOURS = 8;   // 每日标准工时，用于折算实际加班
    // 工作日 = 当月「周一~周五」的天数（与是否填写工时无关）；双休日 = 周六 + 周日天数
    let weekdayDays=0, restDaysInMonth=0;
    let totalHours=0, workDays=0, restDays=0, weekendHours=0;
    let holiHours=0;
    let dateCells='', weekCells='', hourCells='';
    for(let d=1; d<=totalDays; d++){
      const date = new Date(y, m-1, d);
      const dow = (date.getDay()+6)%7; // 0=周一
      const isWeekend = date.getDay()%6===0; // 周六或周日
      const isHoli = isHoliday(y,m,d);
      const isNorm = !isHoli && isNormalMark(y,m,d);
      // 星期一到星期五计为工作日，星期六/星期日计为双休日（休息天不算入工作日）
      if(dow<5) weekdayDays++; else restDaysInMonth++;
      const _dl = getLog(y,m,d);
      // 与日历同款分类：节假日 > 正常 > 加班(>8) > 休息(0) > 双休日
      const _wday = dow<5;
      let _fill = '';
      if(isHoli) _fill = ' holiday-cell';
      else if(isNorm) _fill = ' has-norm-green';
      else if(_dl!==null && _dl>8 && _wday) _fill = ' has-ot';
      else if(_dl!==null && _dl===0) _fill = ' has-rest';
      else if(isWeekend && _dl!==null) _fill = ' has-weekend';
      dateCells += `<td class="${isWeekend?'sat':''}${_fill}">`
        + (isHoli ? '<span class="holi-tag">假</span>' : (isNorm ? '<span class="norm-tag">正</span>' : '')) + d + '</td>';
      weekCells += `<td${isWeekend?' class="sun"':''}>${WEEK[dow]}</td>`;
      const v = getLog(y,m,d);
      if(v===null){
        hourCells += `<td${_fill}>${isHoli?'假':''}</td>`;
      }else if(v>0){
        hourCells += `<td class="${_fill.trim()} work">${v}</td>`;
        totalHours += v; workDays++;
        // 分类互斥：节假日优先 → 正常标记 → 星期六日 → 星期一~五
        if(isHoli){ holiHours += v; }
        else if(isNorm){ /* 正常：强制按周一~五算法，计加班，不计双休日 */ }
        else if(isWeekend){ weekendHours += v; }
      }else{
        hourCells += `<td class="${_fill.trim()} rest">休</td>`; restDays++;
      }
    }
    // 实际加班 = 「正常标记的日期 + 星期一~五（排除节假日）」每天 (工时 - 8) 的总和（不足8小时不计入）
    let overtimeHours = 0, overtimeDays = 0, weekendDays = 0, holiDaysWithHours = 0;
    for(let d=1; d<=totalDays; d++){
      const dow = (new Date(y,m-1,d).getDay()+6)%7;
      const isHoli = isHoliday(y,m,d);
      const isNorm = !isHoli && isNormalMark(y,m,d);
      if(isHoli) continue;                 // 节假日整体排除
      if(dow>=5 && !isNorm) continue;      // 星期六日（除非标了正常 → 按周一~五算）
      const v = getLog(y,m,d);
      if(v!==null && v>WORK_HOURS){ overtimeHours += (v - WORK_HOURS); overtimeDays++; }
    }
    // 双休日 = 星期六日已填工时（节假日与正常标记的日期不归入双休日）；天数 = 其中有工时的周六日
    const weekendNet = weekendHours;
    for(let d=1; d<=totalDays; d++){
      const dow = (new Date(y,m-1,d).getDay()+6)%7;
      if(dow<5) continue;
      if(isHoliday(y,m,d) || isNormalMark(y,m,d)) continue;
      const v = getLog(y,m,d);
      if(v!==null && v>0) weekendDays++;
    }
    // 节假日天数 = 标了「假」且填了工时的天数
    for(let d=1; d<=totalDays; d++){
      if(!isHoliday(y,m,d)) continue;
      const v = getLog(y,m,d);
      if(v!==null && v>0) holiDaysWithHours++;
    }
    document.getElementById('printTitle').textContent = y + '年' + m + '月考勤';
    const html = `<div class="a4-holder"><div class="a4-sheet">`
      + `<h2>${y}年${m}月考勤</h2>`
      + `<table class="att-table"><thead><tr>`
      + `<th class="row-head">项目</th>${dateCells}<th class="sum-head">合计工时</th>`
      + `</tr></thead><tbody>`
      + `<tr><th class="row-head">星期</th>${weekCells}<td class="sum-head"></td></tr>`
      + `<tr><th class="row-head">工时</th>${hourCells}<td class="sum-cell" rowspan="2">${totalHours}</td></tr>`
      + `</tbody></table>`
      + `<div class="a4-foot-note">`
      + `<div>* 正常工作日 ${overtimeDays} 天，实际加班 ${overtimeHours} 小时（工作日每天超过8小时的部分相加）</div>`
      + `<div>* 双休日 ${weekendNet} 小时（周六日填写的工时直接相加）　${weekendDays} 天</div>`
      + (holiHours > 0 ? `<div>* 节假日 ${holiHours} 小时（标记「假」的日子工时直接相加）　${holiDaysWithHours} 天</div>` : '')
      + `<div>* 休息 ${restDays} 天（当日工时记为 0）</div>`
      + `</div>`
      + `</div></div>`;
    document.getElementById('printSheet').innerHTML = html;
    // 同步 Bark 推送标题/正文，使第二页翻月后发送的内容与当前查看月份一致
    const daysInMonth = new Date(y, m, 0).getDate();
    const MONTHS = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
    window._currentBarkTitle = `【${MONTHS[m-1]}考勤-共${daysInMonth}天】`;
    window._currentBarkBody = `正常工作日 ${overtimeDays} 天，实际加班 ${overtimeHours} 小时\n`
      + `* 双休日 ${weekendNet} 小时\n`
      + `* 节假日 ${holiHours} 小时\n`
      + `* 休息 ${restDays} 天`;
  }

  document.getElementById('exportBtn').addEventListener('click', ()=>{
    viewCur = { y:cur.y, m:cur.m };
    buildAttendanceSheet();
    printMask.classList.add('show');
    document.body.classList.add('att-view');
    window.scrollTo(0,0);
  });
  document.getElementById('prevMonthBtn').addEventListener('click', ()=>{
    viewCur.m--; if(viewCur.m<1){ viewCur.m=12; viewCur.y--; }
    buildAttendanceSheet();
  });
  document.getElementById('nextMonthBtn').addEventListener('click', ()=>{
    viewCur.m++; if(viewCur.m>12){ viewCur.m=1; viewCur.y++; }
    buildAttendanceSheet();
  });
})();
function getWeekCn(y,m,d){
  const arr=["周日","周一","周二","周三","周四","周五","周六"];
  return arr[new Date(y,m-1,d).getDay()];
}
function exportCurrentMonthXlsx(){
  return exportMonthXlsx(cur.y, cur.m);
}
function exportMonthXlsx(y, m){
  const totalDays = new Date(y,m,0).getDate();
  const dayCols = totalDays + 2;   // A表头列 + 日期列们 + 合计工时列
  const lastCol = colIndexToColLetter(dayCols-1);
  const sumColL = colIndexToColLetter(totalDays+1); // 合计列0-based = totalDays+1
  let totalHours = 0;
  for(let d=1; d<=totalDays; d++){ const v=getLog(y,m,d); if(v!==null && v>0) totalHours += v; }
  // ---- 共享字符串（标题数字蓝色富文本，与工作簿.xlsx一致） ----
  const siList = [];
  function addSi(xml){ siList.push(xml); return siList.length-1; }
  const siMonth = addSi('<si><t>月份</t></si>');
  const siDate  = addSi('<si><t>日期</t></si>');
  const siWeek  = addSi('<si><t>星期</t></si>');
  const siHour  = addSi('<si><t>工时</t></si>');
  const siSum   = addSi('<si><t>合计工时</t></si>');
  const titleSi = addSi(
    '<si><r><rPr><sz val="11"/><color rgb="FF1677FF"/><rFont val="宋体"/><charset val="134"/></rPr><t>本月一共 </t></r>'
    + '<r><rPr><sz val="11"/><color rgb="FF1677FF"/><rFont val="Arial"/><charset val="134"/></rPr><t>'+totalDays+'</t></r>'
    + '<r><rPr><sz val="11"/><color rgb="FF1677FF"/><rFont val="宋体"/><charset val="134"/></rPr><t xml:space="preserve"> 天</t></r></si>'
  );
  const weekSiCache = {};
  function weekSi(name){
    if(!(name in weekSiCache)) weekSiCache[name] = addSi('<si><t>'+escapeXml(name)+'</t></si>');
    return weekSiCache[name];
  }
  const xiuSi = addSi('<si><t>休</t></si>');
  const colOf = i => colIndexToColLetter(i); // 0-based
  // ---- 四行结构：月份+标题 / 日期 / 星期 / 工时+合计 ----
  let row1 = '<c r="A1" s="2" t="s"><v>'+siMonth+'</v></c>'
    + '<c r="B1" s="1" t="s"><v>'+titleSi+'</v></c>';
  for(let i=2; i<dayCols; i++) row1 += '<c r="'+colOf(i)+'1" s="1"/>';
  let row2 = '<c r="A2" s="2" t="s"><v>'+siDate+'</v></c>';
  for(let d=1; d<=totalDays; d++){
    const L = colOf(d);
    if(isHoliday(y,m,d)) row2 += '<c r="'+L+'2" s="8"><v>'+d+'</v></c>';
    else                 row2 += '<c r="'+L+'2" s="2"><v>'+d+'</v></c>';
  }
  row2 += '<c r="'+sumColL+'2" s="2" t="s"><v>'+siSum+'</v></c>';
  let row3 = '<c r="A3" s="3" t="s"><v>'+siWeek+'</v></c>';
  for(let d=1; d<=totalDays; d++) row3 += '<c r="'+colOf(d)+'3" s="3" t="s"><v>'+weekSi(getWeekCn(y,m,d))+'</v></c>';
  row3 += '<c r="'+sumColL+'3" s="3"/>';
  let row4 = '<c r="A4" s="4" t="s"><v>'+siHour+'</v></c>';
  for(let d=1; d<=totalDays; d++){
    const v = getLog(y,m,d), L = colOf(d);
    if(v===null)      row4 += '<c r="'+L+'4" s="4"/>';
    else if(v>0)      row4 += '<c r="'+L+'4" s="5"><v>'+v+'</v></c>';
    else              row4 += '<c r="'+L+'4" s="6" t="s"><v>'+xiuSi+'</v></c>';
  }
  row4 += '<c r="'+sumColL+'4" s="7"><v>'+totalHours+'</v></c>';
  const sheetDataXml =
    '<row r="1" ht="26" customHeight="1" spans="1:'+dayCols+'">'+row1+'</row>'
    + '<row r="2" ht="18" customHeight="1" spans="1:'+dayCols+'">'+row2+'</row>'
    + '<row r="3" ht="16" customHeight="1" spans="1:'+dayCols+'">'+row3+'</row>'
    + '<row r="4" spans="1:'+dayCols+'">'+row4+'</row>';
  const sheetXml='<?xml version="1.0" encoding="UTF-8"?>\n'
    +'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">\n'
    +'  <dimension ref="A1:'+lastCol+'4"/>\n'
    +'  <sheetViews><sheetView tabSelected="1" workbookViewId="0"><pane xSplit="1" ySplit="3" topLeftCell="B4" activePane="bottomRight" state="frozen"/></sheetView></sheetViews>\n'
    +'  <sheetFormatPr defaultColWidth="9" defaultRowHeight="13.5"/>\n'
    +'  <cols>'
    +'<col min="1" max="1" width="8" customWidth="1"/>'
    +'<col min="2" max="'+(totalDays+1)+'" width="5" customWidth="1"/>'
    +'<col min="'+(totalDays+2)+'" max="'+(totalDays+2)+'" width="9" customWidth="1"/>'

    +'  <sheetData>'+sheetDataXml+'</sheetData>\n'
    +'  <mergeCells count="1"><mergeCell ref="B1:'+lastCol+'1"/></mergeCells>\n'
    +'  <pageMargins left="0.75" right="0.75" top="1" bottom="1" header="0.5" footer="0.5"/>\n'
    +'</worksheet>';
  // ---- 样式：表头/日期行浅蓝底粗体、星期行红字、工时行按index风格绿(有)红(休)橙(空) ----

    +'    <font><sz val="11"/><color rgb="FF1677FF"/><name val="宋体"/><charset val="134"/></font>\n'
    +'    <font><b/><sz val="11"/><name val="宋体"/><charset val="134"/></font>\n'
    +'    <font><b/><sz val="11"/><color rgb="FFC00000"/><name val="宋体"/><charset val="134"/></font>\n'
    +'    <font><b/><sz val="11"/><color rgb="FF52C41A"/><name val="宋体"/><charset val="134"/></font>\n'
    +'    <font><b/><sz val="11"/><color rgb="FFF5222D"/><name val="宋体"/><charset val="134"/></font>\n'
    +'    <font><b/><sz val="11"/><color rgb="FFFA8C16"/><name val="宋体"/><charset val="134"/></font>\n'
    +'  </fonts>\n'
    +'  <fills count="7">\n'
    +'    <fill><patternFill patternType="none"/></fill>\n'
    +'    <fill><patternFill patternType="gray125"/></fill>\n'
    +'    <fill><patternFill patternType="solid"><fgColor rgb="FFD9E1F2"/><bgColor indexed="64"/></patternFill></fill>\n'
    +'    <fill><patternFill patternType="solid"><fgColor rgb="FFFCE4D6"/><bgColor indexed="64"/></patternFill></fill>\n'
    +'    <fill><patternFill patternType="solid"><fgColor rgb="FFF6FFED"/><bgColor indexed="64"/></patternFill></fill>\n'
    +'    <fill><patternFill patternType="solid"><fgColor rgb="FFFFF1F0"/><bgColor indexed="64"/></patternFill></fill>\n'
    +'    <fill><patternFill patternType="solid"><fgColor rgb="FFFFF3E0"/><bgColor indexed="64"/></patternFill></fill>\n'
    +'  </fills>\n'
    +'  <borders count="2">\n'
    +'    <border><left/><right/><top/><bottom/><diagonal/></border>\n'
    +'    <border><left style="thin"><color rgb="FFBFBFBF"/></left><right style="thin"><color rgb="FFBFBFBF"/></right><top style="thin"><color rgb="FFBFBFBF"/></top><bottom style="thin"><color rgb="FFBFBFBF"/></bottom><diagonal/></border>\n'
    +'  </borders>\n'
    +'  <cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>\n'
    +'  <cellXfs count="9">\n'
    +'    <xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>\n'
    +'    <xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>\n'
    +'    <xf numFmtId="0" fontId="2" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>\n'
    +'    <xf numFmtId="0" fontId="3" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>\n'
    +'    <xf numFmtId="0" fontId="0" fillId="3" borderId="1" xfId="0" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>\n'
    +'    <xf numFmtId="0" fontId="4" fillId="4" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>\n'
    +'    <xf numFmtId="0" fontId="5" fillId="5" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>\n'
    +'    <xf numFmtId="0" fontId="2" fillId="3" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>\n'

function colIndexToColLetter(n){
  let s='';
  while(true){
    const rem=n%26;

}
function escapeXml(s){

async function generateXlsxDownload(fileMap, filename){
  const jszip=await getJSZip();
  const zip=new jszip();
  for(const path in fileMap){
    zip.file(path, fileMap[path]);
  }
  const blob=await zip.generateAsync({type:"blob"});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src;
    s.onload=res;
    s.onerror=rej;
    document.head.appendChild(s);
  });
}
