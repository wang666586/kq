<script data-page-node-id="VYzaKrZrlJVFtIR0eajQ11" data-pnid-children="Vd2zljQsFA9c0RUGJaW2YC">
// ============ 已填入你的Worker域名 ============
const WORKER_API_BASE = "https://kq1.wanghai.qzz.io";
// ==============================================

// 内存缓存：全部数据来自云端KV
let cachedBarkUrl = "";
let memoryWorklog = {};

// -------- Worker API 封装 --------
async function loadAllCloudData() {
  try {
    const res = await fetch(`${WORKER_API_BASE}/get?t=${Date.now()}`);
    const json = await res.json();
    if(json.ok){
      cachedBarkUrl = json.bark_url ?? "";
      memoryWorklog = json.worklog ?? {};
      return true;
    }
  } catch (err) {
    console.error("读取云端失败", err);
  }
  return false;
}

async function saveBarkCloud(text) {
  try {
    const res = await fetch(`${WORKER_API_BASE}/save_bark`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: text })
    });
    const j = await res.json();
    return j.ok === true;
  } catch(e){ return false; }
}

async function saveWholeWorklogCloud() {
  try {
    const res = await fetch(`${WORKER_API_BASE}/save_worklog`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ worklog: memoryWorklog })
    });
    const j = await res.json();
    return j.ok === true;
  } catch(e){ return false; }
}

// -------- 日历核心，标准半角减号 --------
function key(y,m,d){ return y+"-"+m+"-"+d; }

function getLog(y,m,d){
  const k = key(y,m,d);
  const v = memoryWorklog[k];
  return (v===undefined || v===null) ? null : Number(v);
}

async function setLog(y,m,d,v){
  const k = key(y,m,d);
  if(v===null || v===""){
    delete memoryWorklog[k];
  }else{
    memoryWorklog[k] = Number(v);
  }
  await saveWholeWorklogCloud();
}

const _now = new Date();
const TODAY = { y:_now.getFullYear(), m:_now.getMonth()+1, d:_now.getDate() };
const WEEK = ["一","二","三","四","五","六","日"];
const MONTHS = ["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];
function monthStats(y,m){
  const days = new Date(y,m,0).getDate();
  let cnt=0, rest=0, total=0;
  for(let d=1;d<=days;d++){ const v=getLog(y,m,d); if(v!==null){ if(v>0){ cnt++; total+=v; } else { rest++; } } }
  return {days,cnt,rest,total};
}
function renderPanel(el, y, m){
  const firstDow = new Date(y, m-1, 1).getDay();
  const firstDay = (firstDow + 6) % 7;
  const days = new Date(y, m, 0).getDate();
  let html = '<table id="calTable"><thead><tr>' + WEEK.map(w=>`<th>${w}</th>`).join('') + '</tr></thead><tbody>';
  let cells = [];
  for(let i=0;i<firstDay;i++) cells.push('<td class="empty"></td>');
  for(let d=1; d<=days; d++){
    let cls = '';
    if(new Date(y,m-1,d).getDay()%6===0) cls = 'weekend';
    if(y===TODAY.y && m===TODAY.m && d===TODAY.d) cls += ' today';
    const logged = getLog(y,m,d);
    if(logged!==null) cls += ' logged ' + (logged>0 ? 'logged-work' : 'logged-rest');
    let inner = String(d);
    if(logged!==null){
      inner += `<span class="wh ${logged>0?'wh-work':'wh-rest'}">${logged===0?'休':logged+'h'}</span>`;
      // 色柱样式统一：所有柱固定同宽(70%)，仅颜色区分绿/红
      const bw = 70;
      const bc = logged>0 ? '#52c41a' : '#f5222d';
      inner += `<span class="day-bar" style="width:${bw}%;background:${bc}"></span>`;
    }
    cells.push(`<td class="${cls.trim()}" data-y="${y}" data-m="${m}" data-d="${d}">${inner}</td>`);
  }
  while(cells.length % 7 !== 0) cells.push('<td class="empty"></td>');
  for(let i=0;i<cells.length;i+=7){ html += '<tr>' + cells.slice(i,i+7).join('') + '</tr>'; }
  html += '</tbody></table>';
  el.innerHTML = html;
}

let cur = { y: TODAY.y, m: TODAY.m };
const MAX_DATE  = new Date(TODAY.y, TODAY.m-1, TODAY.d + 7);
const track = document.getElementById('track');
const p0 = document.getElementById('p0');
const p1 = document.getElementById('p1');
const p2 = document.getElementById('p2');
const titleEl = document.getElementById('title');

function fillPanels(){
  let py = cur.y, pm = cur.m - 1; if(pm<1){ pm=12; py--; }
  let ny = cur.y, nm = cur.m + 1; if(nm>12){ nm=1; ny++; }
  renderPanel(p0, py, pm);
  renderPanel(p1, cur.y, cur.m);
  renderPanel(p2, ny, nm);
  titleEl.textContent = cur.y + ' 年 ' + cur.m + ' 月';
  updateStats();
}
function gotoBase(animate){
  track.classList.toggle('no-anim', !animate);
  track.style.transform = 'translateX(-100%)';
  if(!animate){ void track.offsetWidth; track.classList.remove('no-anim'); }
}
function goNext(){
  track.style.transform = 'translateX(-200%)';
  setTimeout(()=>{
    cur.m++; if(cur.m>12){ cur.m=1; cur.y++; }
    fillPanels();
    gotoBase(false);
  }, 320);
}
function goPrev(){
  track.style.transform = 'translateX(0)';
  setTimeout(()=>{
    cur.m--; if(cur.m<1){ cur.m=12; cur.y--; }
    fillPanels();
    gotoBase(false);
  }, 320);
}

const vp = document.getElementById('viewport');
let startX=0, startY=0, dragging=false, decided=false, horiz=false;
const THRESH = 40;
let justDragged = false;
function onStart(x,y){ startX=x; startY=y; dragging=true; decided=false; horiz=false; }
function onMove(x,y){
  if(!dragging) return;
  const dx=x-startX, dy=y-startY;
  if(!decided && (Math.abs(dx)>8 || Math.abs(dy)>8)){
    decided=true; horiz = Math.abs(dx) > Math.abs(dy);
  }
  if(horiz){
    const clamped = Math.max(-vp.clientWidth, Math.min(vp.clientWidth, dx*0.5));
    track.style.transform = `translateX(calc(-100% + ${clamped}px))`;
  }
}
function onEnd(x){
  if(!dragging) return;
  dragging=false;
  if(!horiz) return;
  const dx = x - startX;
  track.classList.remove('no-anim');
  if(dx < -THRESH){ justDragged = true; setTimeout(()=>justDragged=false, 400); goNext(); }
  else if(dx > THRESH){ justDragged = true; setTimeout(()=>justDragged=false, 400); goPrev(); }
  else gotoBase(true);
}

const NORMAL_HOURS = 8;
const mask  = document.getElementById('mask');
const mDate = document.getElementById('mDate');
const mInput= document.getElementById('mInput');
const mDel  = document.getElementById('mDel');
const mDefault = document.getElementById('mDefault');
let USER_DEFAULT = null;
let sel = null;

function openModal(y,m,d){
  sel = {y,m,d};
  const dt = new Date(y, m-1, d);
  const dw = dt.getDay();
  const wname = ["日","一","二","三","四","五","六"][dw];
  mDate.textContent = `${y}年${m}月${d}日 · 星期${wname}`;
  const recorded = getLog(y,m,d);
  const isWeekday = dw>=1 && dw<=5;
  if(recorded!==null){
    mInput.value = recorded;
  } else if(USER_DEFAULT!==null && USER_DEFAULT!==''){
    mInput.value = USER_DEFAULT;
  } else if(isWeekday){
    mInput.value = NORMAL_HOURS;
  } else {
    mInput.value = '';
  }
  mDefault.checked = (USER_DEFAULT!==null && USER_DEFAULT!=='');
  mDel.style.display = recorded!==null ? 'block' : 'none';
  syncQuick();
  mask.classList.add('show');
  setTimeout(()=>mInput.focus(), 60);
}
function closeModal(){ mask.classList.remove('show'); sel=null; }

document.getElementById('mSave').addEventListener('click', async ()=>{
  if(!sel) return;
  const raw = mInput.value.trim();
  let v = parseFloat(raw);
  if(raw==='' || isNaN(v) || v<0){ v = null; }
  else { v = Math.min(v, 24); }
  await setLog(sel.y, sel.m, sel.d, v);
  closeModal();
  fillPanels();
});
document.getElementById('mCancel').addEventListener('click', closeModal);
mDel.addEventListener('click', async ()=>{
  if(!sel) return;
  await setLog(sel.y, sel.m, sel.d, null);
  closeModal();
  fillPanels();
});
mask.addEventListener('click', e=>{ if(e.target===mask) closeModal(); });

function syncQuick(){
  const v = mInput.value;
  document.querySelectorAll('.m-quick button').forEach(b=>{
    b.classList.toggle('active', b.dataset.h===String(v));
  });
}
function saveUserDefault(){ USER_DEFAULT = mInput.value; }
document.querySelectorAll('.m-quick button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    mInput.value = btn.dataset.h; syncQuick();
    if(mDefault.checked) saveUserDefault();
  });
});
mInput.addEventListener('input', ()=>{
  const clean = mInput.value.replace(/[^0-9.]/g,'').replace(/(\..*)\./g,'$1');
  if(clean !== mInput.value) mInput.value = clean;
  syncQuick(); if(mDefault.checked) saveUserDefault();
});
mDefault.addEventListener('change', ()=>{
  if(mDefault.checked) saveUserDefault();
  else { USER_DEFAULT=null; }
});

track.addEventListener('click', e=>{

function barkConnText(){

}
function showBarkConn(){

  const ok = await saveBarkCloud(val);
  if(ok){

sendBarkBtn.addEventListener('click', async ()=>{
  sendBarkBtn.classList.remove('sent');
  let urlRaw = (cachedBarkUrl||'').trim();
  if(!urlRaw){
    barkTip.textContent="⚠️请先编辑Bark地址";
    barkTip.style.color="#f5222d";
    return;
  }
  if(!window._currentBarkBody || !window._currentBarkTitle){
    barkTip.textContent="⚠️暂无统计内容";
    barkTip.style.color="#f5222d";
    return;
  }
  // 协议统一：https页面请求http接口会被浏览器当作混合内容直接拦截(手机端尤其严格)，
  // 故发送前自动把 http:// 升级为 https://（Bark官方服务器支持https）
  const wasHttp = /^http:\/\//i.test(urlRaw);
  if(wasHttp){ urlRaw = 'https://' + urlRaw.slice(7); }
  else if(!/^https:\/\//i.test(urlRaw)){ urlRaw = 'https://' + urlRaw; }
  urlRaw = urlRaw.replace(/\/+$/,'');
  barkTip.textContent="发送中…";
  barkTip.style.color="#666";
  const t = encodeURIComponent(window._currentBarkTitle);
  const b = encodeURIComponent(window._currentBarkBody);
  const attempt = async (fn)=>{ try{ await fn(); return true; }catch(e){ console.error(e); return false; } };
  // 方式1：POST表单（no-cors，请求发出即成功）
  let ok = await attempt(()=> fetch(urlRaw, {
    method:'POST', mode:'no-cors',
    headers:{ 'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8' },
    body: new URLSearchParams({ title: window._currentBarkTitle, body: window._currentBarkBody })
  }));
  // 方式2：GET路径兜底（Bark原生GET格式 /key/title/body）
  if(!ok){
    ok = await attempt(()=> fetch(`${urlRaw}/${t}/${b}`, { method:'GET', mode:'no-cors' }));
  }
  if(ok){
    barkTip.textContent="✅Bark推送发送成功";
    barkTip.style.color="#00b42a";
    sendBarkBtn.classList.add('sent');
  }else if(wasHttp && location.protocol==='https:'){
    barkTip.textContent="❌发送失败：Bark地址为http，当前https页面禁止调用，请改用https地址";
    barkTip.style.color="#f5222d";
  }else{
    barkTip.textContent="❌发送失败，请检查网络或Bark地址是否正确";
    barkTip.style.color="#f5222d";
  }
  setTimeout(showBarkConn,3000);
});

const THEME_LS = 'kq_theme';
(function bindTheme(){
  const btn = document.getElementById('themeToggle');
  function applyTheme(dark){
    document.body.classList.toggle('dark', dark);
  }
  function currentDark(){
    try{
      const saved = localStorage.getItem(THEME_LS);

    }catch(e){}

})();

// ================= 登录认证（门禁） =================
// ---- 预留 API：接入真实后端时，把 enabled 改为 true 并填好对应路径 ----
const AUTH_API = {
  base: WORKER_API_BASE,           // 后端域名（复用现有 Worker 域名）
  login:    "/auth/login",         // 预留：POST { username, password }
  register: "/auth/register",      // 预留：POST { username, password }
  changePwd:"/auth/change_pwd",    // 预留：POST { username, oldPassword, newPassword }
  enabled: false                   // ← true = 走真实接口，false = 本地模拟
};
const AUTH_LS = { user:"kq_auth_user", pwd:"kq_auth_pwd", rem:"kq_auth_rem", reg:"kq_auth_regs", session:"kq_auth_session" };
const AUTH_DEFAULT_USERS = { "9523130": "123456" };  // 内置账号

// 轻量混淆（非加密，仅避免明文直读；真实项目请走后端哈希）
function authEnc(s){ try{ return btoa(unescape(encodeURIComponent(s))); }catch(e){ return s; } }
function authDec(s){ try{ return decodeURIComponent(escape(atob(s))); }catch(e){ return s; } }

function authGetRegistered(){
  try{ return JSON.parse(localStorage.getItem(AUTH_LS.reg) || "{}"); }catch(e){ return {}; }
}
function authAllUsers(){
  // 内置账号 + 本地注册/改密覆盖（后者优先）
  return Object.assign({}, AUTH_DEFAULT_USERS, authGetRegistered());
}
function authSaveRegistered(obj){
  try{ localStorage.setItem(AUTH_LS.reg, JSON.stringify(obj)); }catch(e){}
}

// 真实 API 调用封装（enabled=true 时启用）
async function authApiCall(path, payload){
  const res = await fetch(AUTH_API.base + path, {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(payload)
  });
  return await res.json();
}

(function bindAuth(){
  const gate = document.getElementById('authMask');
  const viewLogin = document.getElementById('authViewLogin');
  const viewReg   = document.getElementById('authViewReg');
  const viewPwd   = document.getElementById('authViewPwd');
  const msgLogin  = document.getElementById('authMsg');
  const msgReg    = document.getElementById('regMsg');
  const msgPwd    = document.getElementById('pwdMsg');

  function showView(v){
    viewLogin.style.display = (v==='login') ? '' : 'none';
    viewReg.style.display   = (v==='reg')   ? '' : 'none';
    viewPwd.style.display   = (v==='pwd')   ? '' : 'none';
  }
  function setMsg(el, text, ok){
    el.textContent = text || '';
    el.className = 'auth-msg' + (ok ? ' ok' : '');
  }

  // ---------- 记住密码：自动填充 ----------
  (function autoFill(){
    try{
      const u = localStorage.getItem(AUTH_LS.user) || '';
      const rem = localStorage.getItem(AUTH_LS.rem) === '1';
      document.getElementById('authUser').value = u;
      document.getElementById('pwdUser').value = u;
      if(rem){
        document.getElementById('authRemember').checked = true;
        const p = localStorage.getItem(AUTH_LS.pwd);
        if(p) document.getElementById('authPass').value = authDec(p);
      }
    }catch(e){}
  })();

  // ---------- 登录 ----------
  async function doLogin(){
    const u = (document.getElementById('authUser').value||'').trim();
    const p = document.getElementById('authPass').value || '';
    if(!u || !p){ setMsg(msgLogin, '请输入登录名和密码'); return; }
    let ok = false, reason = '登录名或密码错误';
    if(AUTH_API.enabled){
      try{ const r = await authApiCall(AUTH_API.login, { username:u, password:p }); ok = !!r.ok; reason = r.msg || reason; }
      catch(e){ reason = '网络异常，请稍后重试'; }
    }else{
      const users = authAllUsers();
      ok = (users[u] !== undefined && users[u] === p);
    }
    if(!ok){ setMsg(msgLogin, reason); return; }
    // 记住策略
    try{
      localStorage.setItem(AUTH_LS.user, u);
      if(document.getElementById('authRemember').checked){
        localStorage.setItem(AUTH_LS.rem, '1');
        localStorage.setItem(AUTH_LS.pwd, authEnc(p));
      }else{
        localStorage.setItem(AUTH_LS.rem, '0');
        localStorage.removeItem(AUTH_LS.pwd);
      }
      sessionStorage.setItem(AUTH_LS.session, '1');
    }catch(e){}
    setMsg(msgLogin, '登录成功，正在进入…', true);
    gate.classList.add('hide');
    enterApp();
  }

  // ---------- 注册 ----------
  async function doRegister(){
    const u = (document.getElementById('regUser').value||'').trim();
    const p = document.getElementById('regPass').value || '';
    const p2 = document.getElementById('regPass2').value || '';
    if(!/^[A-Za-z0-9_]{3,16}$/.test(u)){ setMsg(msgReg, '登录名需 3-16 位字母/数字/下划线'); return; }
    if(p.length < 6){ setMsg(msgReg, '密码至少 6 位'); return; }
    if(p !== p2){ setMsg(msgReg, '两次输入的密码不一致'); return; }
    if(authAllUsers()[u] !== undefined && !authGetRegistered().hasOwnProperty(u)){
      setMsg(msgReg, '该登录名已被占用'); return;
    }
    if(authGetRegistered().hasOwnProperty(u)){ setMsg(msgReg, '该登录名已注册'); return; }
    if(AUTH_API.enabled){
      try{
        const r = await authApiCall(AUTH_API.register, { username:u, password:p });
        if(!r.ok){ setMsg(msgReg, r.msg || '注册失败'); return; }
      }catch(e){ setMsg(msgReg, '网络异常，请稍后重试'); return; }
    }else{
      const regs = authGetRegistered(); regs[u] = p; authSaveRegistered(regs);
    }
    setMsg(msgReg, '注册成功，请返回登录', true);
    setTimeout(()=>{
      showView('login');
      document.getElementById('authUser').value = u;
      document.getElementById('authPass').value = p;
      setMsg(msgLogin, '注册成功，请登录', true);
    }, 700);
  }

  // ---------- 修改密码 ----------
  async function doChangePwd(){
    const u = (document.getElementById('pwdUser').value||'').trim();
    const o = document.getElementById('pwdOld').value || '';
    const n = document.getElementById('pwdNew').value || '';
    const n2 = document.getElementById('pwdNew2').value || '';
    if(!u || !o){ setMsg(msgPwd, '请输入登录名和原密码'); return; }
    if(n.length < 6){ setMsg(msgPwd, '新密码至少 6 位'); return; }
    if(n !== n2){ setMsg(msgPwd, '两次输入的新密码不一致'); return; }
    if(AUTH_API.enabled){
      try{
        const r = await authApiCall(AUTH_API.changePwd, { username:u, oldPassword:o, newPassword:n });
        if(!r.ok){ setMsg(msgPwd, r.msg || '修改失败'); return; }
      }catch(e){ setMsg(msgPwd, '网络异常，请稍后重试'); return; }
    }else{
      const users = authAllUsers();
      if(users[u] === undefined || users[u] !== o){ setMsg(msgPwd, '登录名或原密码错误'); return; }
      const regs = authGetRegistered(); regs[u] = n; authSaveRegistered(regs);
    }
    setMsg(msgPwd, '密码修改成功，请返回登录', true);
    setTimeout(()=>{
      showView('login');
      document.getElementById('authUser').value = u;
      document.getElementById('authPass').value = '';
      localStorage.setItem(AUTH_LS.user, u);
      localStorage.setItem(AUTH_LS.rem,'0');
      localStorage.removeItem(AUTH_LS.pwd);
      setMsg(msgLogin, '密码已修改，请重新登录', true);
    }, 700);
  }

  // ---------- 事件绑定 ----------
  document.getElementById('authLoginBtn').addEventListener('click', doLogin);
  document.getElementById('regSubmit').addEventListener('click', doRegister);
  document.getElementById('pwdSubmit').addEventListener('click', doChangePwd);
  document.getElementById('authToReg').addEventListener('click', ()=>{ setMsg(msgReg,''); showView('reg'); });
  document.getElementById('authToPwd').addEventListener('click', ()=>{ setMsg(msgPwd,''); showView('pwd'); });
  document.getElementById('regBack').addEventListener('click', ()=>showView('login'));
  document.getElementById('pwdBack').addEventListener('click', ()=>showView('login'));
  // 回车快捷提交
  ['authPass'].forEach(id=>document.getElementById(id).addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); }));
  document.getElementById('regPass2').addEventListener('keydown', e=>{ if(e.key==='Enter') doRegister(); });
  document.getElementById('pwdNew2').addEventListener('keydown', e=>{ if(e.key==='Enter') doChangePwd(); });

  // 退出登录
  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    try{ sessionStorage.removeItem(AUTH_LS.session); }catch(e){}
    document.body.classList.remove('app-on');   // 回到登录页：重新显示主题切换按钮
    document.getElementById('authPass').value = '';
    setMsg(msgLogin, '');
    showView('login');
    gate.classList.remove('hide');
    window.scrollTo(0,0);
  });

  // ---------- 门禁放行 ----------
  window.__authEnter = enterApp;
  // 同一浏览器标签页上一次已登录（session 内），直接放行
  let autoIn = false;
  try{ autoIn = sessionStorage.getItem(AUTH_LS.session) === '1'; }catch(e){}
  if(autoIn){ gate.classList.add('hide'); enterApp(); }
})();

(function bindViewAttendance(){
  const printMask = document.getElementById('printMask');
  function closeAttView(){
    printMask.classList.remove('show');
    document.body.classList.remove('att-view');
    document.body.classList.remove('a4-preview');

    window.scrollTo(0,0);
  }
  document.getElementById('printClose').addEventListener('click', closeAttView);
  document.getElementById('printBtn').addEventListener('click', ()=>{
    const btn = document.getElementById('printBtn');
    if(document.body.classList.contains('a4-preview')){
      window.print();
    }else{
      document.body.classList.add('a4-preview');
      printMask.classList.add('show');
      btn.textContent = '确认打印';
      window.scrollTo(0,0);
    }
  });

  let viewCur = null;
  function buildAttendanceSheet(){
    const y=viewCur.y, m=viewCur.m;
    const totalDays = new Date(y,m,0).getDate();
    const WEEK=["一","二","三","四","五","六","日"];
    let totalHours=0, workDays=0, restDays=0, weekdayHours=0, weekendHours=0;
    let dateCells='', weekCells='', hourCells='';
    for(let d=1; d<=totalDays; d++){
      const date = new Date(y, m-1, d);
      const dow = (date.getDay()+6)%7; // 0=周一
      const isWeekend = date.getDay()%6===0; // 周六或周日
      dateCells += `<td${isWeekend?' class="sat"':''}>${d}</td>`;
      weekCells += `<td${isWeekend?' class="sun"':''}>${WEEK[dow]}</td>`;
      const v = getLog(y,m,d);
      if(v===null) hourCells += '<td></td>';
      else if(v>0){ hourCells += `<td class="work">${v}</td>`; totalHours += v; workDays++; if(dow<5) weekdayHours += v; else weekendHours += v; }
      else { hourCells += '<td class="rest">休</td>'; restDays++; }
    }
    document.getElementById('printTitle').textContent = y + '年' + m + '月考勤';
    const html = `<div class="a4-sheet">`
      + `<h2>${y}年${m}月考勤</h2>`
      + `<table class="att-table"><thead><tr>`
      + `<th class="row-head">项目</th>${dateCells}<th class="sum-head">合计工时</th>`
      + `</tr></thead><tbody>`
      + `<tr><th class="row-head">星期</th>${weekCells}<td class="sum-head"></td></tr>`
      + `<tr><th class="row-head">工时</th>${hourCells}<td class="sum-cell">${totalHours}</td></tr>`
      + `</tbody></table>`
      + `<div class="a4-sub">提示：工作日 ${weekdayHours} 小时　双休日 ${weekendHours} 小时</div>`
      + `</div>`;
    document.getElementById('printSheet').innerHTML = html;
  }

  document.getElementById('exportBtn').addEventListener('click', ()=>{
    viewCur = { y:cur.y, m:cur.m };
    buildAttendanceSheet();
    printMask.classList.add('show');
    document.body.classList.add('att-view');
    window.scrollTo(0,0);

function colIndexToColLetter(n){
  let s='';
  while(true){
    const rem=n%26;
    s=String.fromCharCode(65+rem)+s;
    n=Math.floor(n/26)-1;
    if(n<0)break;
  }
  return s;
}
function escapeXml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}

async function generateXlsxDownload(fileMap, filename){
  const jszip=await getJSZip();
  const zip=new jszip();
  for(const path in fileMap){
    zip.file(path, fileMap[path]);
  }
  const blob=await zip.generateAsync({type:"blob"});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

let _jszipCache=null;
async function getJSZip(){
  if(_jszipCache) return _jszipCache;
  await loadScript("https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js");
  _jszipCache=window.JSZip;
  return _jszipCache;
}
function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src;
    s.onload=res;
    s.onerror=rej;
    document.head.appendChild(s);
  });
}
